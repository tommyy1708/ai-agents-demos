[project]
name = "hotel-voice-agent"
version = "0.1.0"
description = "Week 5 demo: a hotel voice reservation agent, built one variable at a time"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "livekit-agents[anthropic,silero,turn-detector]==1.8.8",
  "python-dotenv>=1.0",
]

[project.scripts]
hotel = "hotel_agent.cli:main"
hotel-voice = "hotel_agent.voice:main"

[dependency-groups]
dev = ["pytest==8.4.2", "pytest-asyncio==1.2.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hotel_agent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
