[project]
name = "secure-support-agent"
version = "0.1.0"
description = "Week 4 demo: a secure customer-support agent with ADK, MCP and A2A"
requires-python = ">=3.11"
dependencies = [
  "google-adk[a2a]==2.12.0",
  "anthropic==2.1.0",
  "mcp==2.3.0",
  "httpx>=0.28",
]

[project.scripts]
support-agent = "support_agent.cli:main"

[dependency-groups]
dev = ["pytest==8.4.2", "pytest-asyncio==1.2.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/support_agent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
