name: tests

on:
  push:
  pull_request:

jobs:
  demos:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        demo: [c4-secure-support-agent]
    defaults:
      run:
        working-directory: ${{ matrix.demo }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      # Mock mode: no API key, no cost.
      - run: uv sync --locked
      - run: uv run pytest
