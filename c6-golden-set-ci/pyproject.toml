[project]
name = "golden-set-ci"
version = "0.1.0"
description = "Week 6 demo: tracing, a golden dataset, a release gate and a nightly judge for the Week 4 support agent"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "secure-support-agent",
  "opentelemetry-sdk>=1.42",
  "opentelemetry-exporter-otlp-proto-http>=1.42",
]

[project.scripts]
golden = "golden_ci.cli:main"

[tool.uv.sources]
# The Week 4 agent, unchanged: this demo only adds layers around it.
secure-support-agent = { path = "../c4-secure-support-agent", editable = true }

[dependency-groups]
dev = ["pytest==8.4.2", "pytest-asyncio==1.2.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/golden_ci"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
